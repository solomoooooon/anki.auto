<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review · anki.auto</title><link rel="stylesheet" href="style.css"><body><header class="header"><a class="brand" href="review.html">anki.auto</a><nav><a href="capture.html">Capture</a><a href="settings.html">Settings</a></nav><span id="profile" class="connection">Local Anki</span></header><main class="page"><section id="chooser" class="panel"><h1>Your decks, one queue</h1><p>Select the decks to mix. Anki keeps each card’s history and daily limits.</p><form id="decks-form"><div class="row"><button id="all" type="button">Select all</button><button id="none" type="button">Clear</button></div><div id="decks" class="deck-list"></div><div class="actions"><button id="recover" type="button" hidden>Resume interrupted session</button><button id="finish-old" type="button" hidden>End interrupted session</button><button id="start" class="primary">Start combined queue</button></div></form></section><section id="study" class="study" hidden><div class="study-top"><span id="home"></span><span id="counts"></span></div><div class="panel study-panel"><iframe id="card" title="Anki card" class="study-frame" sandbox="allow-same-origin"></iframe><p id="empty" hidden></p><div class="review-controls"><button id="reveal" class="primary">Show answer <kbd>Space</kbd></button><div id="ratings" class="ratings" hidden><button data-rating="1">Again<small></small></button><button data-rating="2">Hard<small></small></button><button class="primary" data-rating="3">Good<small></small></button><button data-rating="4">Easy<small></small></button></div></div></div><div class="study-footer"><button id="overview" class="quiet">Decks <kbd>S</kbd></button><div class="row"><button id="undo" class="quiet">Undo <kbd>U</kbd></button><button id="edit" class="quiet">Edit <kbd>E</kbd></button><button id="more" class="quiet" aria-expanded="false">More <kbd>M</kbd></button></div></div><div id="more-menu" class="more-menu" hidden><button data-action="mark">Mark *</button><button data-action="bury_card">Bury card −</button><button data-action="bury_note">Bury note =</button><button data-action="suspend_card">Suspend card @</button><button data-action="suspend_note">Suspend note !</button><button data-action="info">Card info I</button><button data-action="previous_info">Previous info</button><button data-action="replay">Replay R</button><button data-action="options">Deck options O</button><button data-action="native_edit">Open in Anki</button><label>Flag<select id="flag"><option value="0">None</option><option value="1">Red</option><option value="2">Orange</option><option value="3">Green</option><option value="4">Blue</option><option value="5">Pink</option><option value="6">Turquoise</option><option value="7">Purple</option></select></label></div></section><section class="review-error"><p id="status" class="status" role="status"></p><div class="row"><button id="retry" hidden>Retry last action</button><button id="resume" hidden>Refresh / resume</button><button id="end" hidden>End session</button></div></section></main><dialog id="editor"><h2>Edit note</h2><p class="hint">Only changed fields are replaced with plain text. Use “Open in Anki” for rich formatting.</p><form id="edit-form"><div id="edit-fields"></div><p id="edit-status" class="status" role="status"></p><div class="actions"><button id="edit-cancel" type="button">Cancel</button><button class="primary">Save</button></div></form></dialog><dialog id="info"><h2>Card information</h2><dl id="info-fields"></dl><button id="info-close">Close</button></dialog><script src="review.js" type="module"></script></body></html>
