<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add vocabulary · anki.auto</title><link rel="stylesheet" href="style.css"></head><body>
<main class="page"><div id="capture-layout" class="capture-layout single">
<form id="capture-form" class="panel"><div class="row between"><h2>New card</h2><button type="button" class="quiet" id="close" aria-label="Close">×</button></div>
<fieldset id="fields"><label class="field"><span>Word or expression</span><input id="expression" maxlength="1000" required autofocus></label>
<div class="two"><label class="field"><span>Destination deck</span><select id="deck" required><option value="">Choose a deck</option></select></label><label class="field"><span>Language</span><select id="language"><option value="auto">Auto</option><option value="fr">French</option><option value="en">English</option></select></label></div>
<label class="field"><span>Custom definition <small>(optional)</small></span><textarea id="definition" maxlength="4000" placeholder="Leave blank to generate on Send"></textarea><small>Your definition skips automatic lookup.</small></label>
<label class="check"><input type="checkbox" id="example">Add example</label>
<div id="manual-example" hidden><p class="hint">Enter your example pair to keep model calls off.</p><label class="field"><span>Example front · English sentence</span><textarea id="example-front" maxlength="2000"></textarea></label><label class="field"><span>Example back · French translation</span><textarea id="example-back" maxlength="2000"></textarea></label></div>
<details><summary>Sentence context</summary><textarea id="context" maxlength="8000" aria-label="Sentence context"></textarea></details>
<div class="actions"><button type="button" class="quiet" id="cancel">Cancel</button><button type="submit" id="send" class="primary">Send</button></div></fieldset>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="result" hidden></div><div class="actions" id="saved-actions" hidden><button type="button" id="edit-saved">Edit card</button><button type="button" id="new-capture">New card</button></div>
</form><aside id="matches" class="panel match-panel" hidden aria-label="Near matches"><h3>Already in this deck</h3><div id="match-list"></div><div class="actions"><button type="button" id="match-cancel">Cancel</button><button type="button" id="continue" class="primary">Continue anyway</button></div></aside></div></main>
<dialog id="edit-dialog"><h2>Edit saved card</h2><form id="edit-form"><div id="edit-fields"></div><div class="actions"><button type="button" id="edit-cancel">Cancel</button><button type="submit" class="primary">Save changes</button></div><p id="edit-status" role="status" class="status"></p></form></dialog>
<script src="capture.js" type="module"></script></body></html>
