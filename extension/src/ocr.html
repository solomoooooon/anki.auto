<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extract text · anki.auto</title><link rel="stylesheet" href="style.css"><body><header class="header"><a class="brand" href="review.html">anki.auto</a><span>Screenshot → text</span></header><main class="page"><section class="panel"><h1>Crop the words</h1><p>Drag a rectangle around the text. Or paste an image with Ctrl+V.</p><input id="file" type="file" accept="image/*"><div id="stage" class="crop-stage" hidden><img id="image" alt="Screenshot to crop" draggable="false"><div id="crop" class="crop-box" hidden></div></div><div class="actions"><button id="reset">Use whole image</button><button id="extract" class="primary" disabled>Extract text locally</button></div><p id="status" class="status" role="status"></p><label class="field"><span>Check and select the extracted words</span><textarea id="text" class="ocr-text" placeholder="Recognized text appears here. Correct any mistakes, then select the portion to capture."></textarea></label><button id="capture" class="primary">Capture selected text</button><p class="hint">No image is saved into Anki. Only the words you confirm are sent for translation.</p></section></main><script src="ocr.js" type="module"></script></body></html>
