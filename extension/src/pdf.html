<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF reader · anki.auto</title><link rel="stylesheet" href="style.css"><body><header class="header"><a class="brand" href="review.html">anki.auto</a><span>PDF reader</span><a href="ocr.html">Paste a screenshot</a></header><main class="page"><section class="panel"><div class="pdf-controls"><label>Open a PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><button id="previous">← Previous</button><label>Page<input id="page" type="number" min="1" value="1" style="width:90px"></label><span id="pages"></span><button id="next">Next →</button></div><p class="hint">Select words, then click ✓. Scanned pages: use “Extract this page” and crop the text.</p><button id="ocr" disabled>Extract this page</button><p id="status" class="status" role="status"></p></section><div id="pdf" class="pdf-container"><canvas id="canvas"></canvas><div id="text-layer" class="textLayer"></div></div><button id="marker" class="pdf-marker" title="Add selection to Anki" aria-label="Add selection to Anki" hidden>✓</button></main><script src="pdf.js" type="module"></script></body></html>
